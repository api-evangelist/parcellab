naftiko: 1.0.0-alpha2
info:
  label: parcelLab API — Pickup/Drop-Off Locations
  description: parcelLab API — Place Info. Look up nearby PUDO points for one or more couriers.
  tags:
  - ParcelLab
  - PUDO
  - Logistics
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    PARCELLAB_API_TOKEN: PARCELLAB_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: parcellab-place-info
    baseUri: https://api.parcellab.com
    description: parcelLab PUDO lookup.
    resources:
    - name: place-info-lookup
      path: /v4/track/place-info/lookup/
      operations:
      - name: lookupplaceinfo
        method: POST
        description: Look up nearby PUDO locations for a list of courier queries.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: PlaceInfoLookupRequest payload.
          required: true
        - name: account
          in: query
          type: string
          required: false
    authentication:
      type: header
      header: Authorization
      value: 'Parcellab-API-Token {{env.PARCELLAB_API_TOKEN}}'
  exposes:
  - type: rest
    namespace: parcellab-place-info-rest
    port: 8080
    description: REST adapter for parcelLab Place Info.
    resources:
    - path: /v1/place-info/lookup
      name: place-info-lookup
      operations:
      - method: POST
        name: lookupplaceinfo
        description: Lookup PUDO locations.
        call: parcellab-place-info.lookupplaceinfo
        with:
          body: rest.body
          account: rest.account
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: parcellab-place-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for parcelLab Place Info.
    tools:
    - name: lookup-place-info
      description: Look up nearby PUDO points.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: parcellab-place-info.lookupplaceinfo
      with:
        body: tools.body
        account: tools.account
      outputParameters:
      - type: object
        mapping: $.
